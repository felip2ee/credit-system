services:
  postgres:
    image: postgres:18.6-alpine3.23
    ports:
      - "127.0.0.1:54329:5432"
    environment:
      POSTGRES_DB: credit_system
      POSTGRES_USER: app_runtime
      POSTGRES_PASSWORD: test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_runtime -d credit_system"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - private

  clamav:
    image: clamav/clamav:1.4.6_base-debian13-slim
    networks:
      - private

volumes:
  postgres_data:

networks:
  private:
    internal: true
