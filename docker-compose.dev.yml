# Dev only. Same role bootstrap as production (docker/postgres/init), fed by
# throwaway secrets in docker/dev-secrets (all "test"). Never use in production.
services:
  postgres:
    image: postgres:18.6-alpine3.23
    ports:
      - "127.0.0.1:54329:5432"
    environment:
      POSTGRES_DB: credit_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      INIT_ALLOW_WEAK_SECRETS: "1"
    secrets: [postgres_password, schema_owner_password, app_runtime_password, backup_reader_password, app_webhook_password, app_dispatch_password]
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init/001-users.sh:/docker-entrypoint-initdb.d/001-users.sh:ro
      - ./docker/postgres/dev-init/002-dev-marker.sh:/docker-entrypoint-initdb.d/002-dev-marker.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d credit_system"]
      interval: 5s
      timeout: 5s
      retries: 10

  clamav:
    image: clamav/clamav:1.4.6_base-debian13-slim
    ports:
      - "127.0.0.1:3310:3310"

volumes:
  postgres_data:

secrets:
  postgres_password: { file: ./docker/dev-secrets/postgres_password }
  schema_owner_password: { file: ./docker/dev-secrets/schema_owner_password }
  app_runtime_password: { file: ./docker/dev-secrets/app_runtime_password }
  backup_reader_password: { file: ./docker/dev-secrets/backup_reader_password }
  app_webhook_password: { file: ./docker/dev-secrets/app_webhook_password }
  app_dispatch_password: { file: ./docker/dev-secrets/app_dispatch_password }
