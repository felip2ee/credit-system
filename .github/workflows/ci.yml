name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_OWNER_URL: postgres://postgres:test@localhost:54329/credit_system
      TEST_DATABASE_URL: postgres://app_runtime:test@localhost:54329/credit_system
      TEST_DATABASE_OWNER_URL: postgres://postgres:test@localhost:54329/credit_system
      TEST_DATABASE_DISPATCH_URL: postgres://app_dispatch:test@localhost:54329/credit_system
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Start Postgres 18 (same role bootstrap as production)
        run: docker compose -f docker-compose.dev.yml up -d --wait postgres
      - run: npm run lint
      - run: npm run type-check
      - run: npx vitest run --exclude '**/*.integration.test.ts'
      - run: npm run db:migrate:test
      - run: npm run setup:test
      - run: npm run ops:test
      - name: Migrate (twice - second run must be a no-op)
        run: npm run db:migrate && npm run db:migrate | tee /tmp/m2 && grep -q "database schema is current" /tmp/m2
      - run: npx vitest run integration.test
      - name: Build
        env:
          DATABASE_URL: postgres://build:placeholder@localhost:5432/build
          BETTER_AUTH_SECRET: build-only-placeholder-not-a-production-secret
          BETTER_AUTH_URL: https://build.invalid
          DOCUMENT_ROOT: /tmp/documents
          CLAMAV_HOST: localhost
          CLAMAV_PORT: "3310"
          SMTP_HOST: localhost
          SMTP_PORT: "465"
          SMTP_SECURE: "true"
          SMTP_USER: build
          SMTP_PASS: build-only-placeholder
          TRAEFIK_PROXY_CIDR: 10.0.0.0/8
          NODE_ENV: production
        run: npm run build
      - run: npx playwright install --with-deps chromium
      # The integration suites leave many Bureaus behind; the orders tick sweeps all of them.
      - name: Reset the database for e2e
        run: npm run db:reset
      - name: E2E (Playwright)
        env:
          DATABASE_URL: postgres://app_runtime:test@localhost:54329/credit_system
          BETTER_AUTH_SECRET: e2e-only-not-a-production-secret-0123456789
          BETTER_AUTH_URL: http://127.0.0.1:3000
          DOCUMENT_ROOT: /tmp/documents
          CLAMAV_HOST: localhost
          CLAMAV_PORT: "3310"
          SMTP_HOST: localhost
          SMTP_PORT: "465"
          SMTP_SECURE: "true"
          SMTP_USER: e2e
          SMTP_PASS: e2e-only-placeholder
          TRAEFIK_PROXY_CIDR: 10.0.0.0/8
          ASAAS_DRIVER: fake
          WHATSAPP_DRIVER: fake
          NOTIFICATIONS_DISPATCH_SECRET: e2e-dispatch-secret-0123456789abcdef
          # Not production: config requires an https BETTER_AUTH_URL and the fake drivers are blocked there.
          NODE_ENV: test
          TEST_DATABASE_OWNER_URL: postgres://postgres:test@localhost:54329/credit_system
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
