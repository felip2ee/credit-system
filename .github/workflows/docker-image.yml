name: Docker Image (GHCR)

# Builda as imagens de produção e publica no GitHub Container Registry.
# A stack (docker-stack.yml) consome por digest: pegue REINO_IMAGE_OWNER e
# REINO_IMAGE_DIGEST (app) / REINO_BACKUP_DIGEST (backup) do resumo do job.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - image: reino-credito
            context: .
          - image: reino-backup
            context: docker/backup

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          # Commit-SHA tag only, for discovery. No `latest`. The stack deploys by
          # digest, never by a mutable tag.
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Report deployable digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ matrix.image }}
        run: |
          hex="${DIGEST#sha256:}"
          var=REINO_IMAGE_DIGEST
          [ "$IMAGE" = "reino-backup" ] && var=REINO_BACKUP_DIGEST
          echo "Deploy this digest in docker-stack.yml:"
          {
            echo "### Deployable image: ${IMAGE}"
            echo '```'
            echo "REINO_IMAGE_OWNER=${{ github.repository_owner }}"
            echo "${var}=${hex}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
