name: Docker Image (GHCR)

# Builda a imagem de produção e publica no GitHub Container Registry.
# A stack (docker-stack.yml) consome por digest: pegue REINO_IMAGE_OWNER e
# REINO_IMAGE_DIGEST do resumo do job "Report deployable digest".

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/reino-credito

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Commit-SHA tag only, for discovery. No `latest`. The stack deploys by
          # digest (REINO_IMAGE_DIGEST), never by a mutable tag.
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report deployable digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          hex="${DIGEST#sha256:}"
          echo "Deploy this digest in docker-stack.yml:"
          {
            echo "### Deployable image"
            echo '```'
            echo "REINO_IMAGE_OWNER=${{ github.repository_owner }}"
            echo "REINO_IMAGE_DIGEST=${hex}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
