services:
  reino_app:
    # Digest-only: owner + sha256 digest are both required, so a mutable tag or
    # `latest` can never satisfy stack config. Digest comes from the GHCR build.
    image: &app_image ghcr.io/${REINO_IMAGE_OWNER:?REINO_IMAGE_OWNER is required}/reino-credito@sha256:${REINO_IMAGE_DIGEST:?REINO_IMAGE_DIGEST must be the 64-hex sha256 digest of the release image}
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    stop_grace_period: 30s
    networks: [RainhaNet, private]
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      TZ: America/Sao_Paulo
      BETTER_AUTH_URL: https://${APP_DOMAIN:?APP_DOMAIN is required}
      TRAEFIK_PROXY_CIDR: ${TRAEFIK_PROXY_CIDR:?TRAEFIK_PROXY_CIDR is required}
      DOCUMENT_ROOT: /var/lib/reino/documents
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:?SMTP_USER is required}
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM is required}
      DEPS_API_BASE_URL: ${DEPS_API_BASE_URL:-https://api-portal.deps.com.br}
      DEPS_API_EMAIL: ${DEPS_API_EMAIL:?DEPS_API_EMAIL is required}
      DEPS_API_CENTRO_CUSTOS: ${DEPS_API_CENTRO_CUSTOS:-}
      DEPS_PRODUTO_PF: ${DEPS_PRODUTO_PF:-Smart PF 002}
      DEPS_PRODUTO_PJ: ${DEPS_PRODUTO_PJ:-Smart PJ 010}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      DATABASE_URL_FILE: /run/secrets/database_url
      BETTER_AUTH_SECRET_FILE: /run/secrets/better_auth_secret
      SMTP_PASS_FILE: /run/secrets/smtp_pass
      DEPS_API_PASSWORDL_FILE: /run/secrets/deps_api_password
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
    secrets: [database_url, better_auth_secret, smtp_pass, deps_api_password, openai_api_key]
    volumes:
      - documents:/var/lib/reino/documents
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      update_config:
        order: stop-first
        failure_action: rollback
        delay: 10s
      rollback_config:
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      resources:
        limits: { cpus: "1", memory: 1024M }
        reservations: { cpus: "0.25", memory: 512M }
      labels:
        - traefik.enable=true
        - traefik.docker.network=RainhaNet
        - traefik.http.routers.reino_app.rule=Host(`${APP_DOMAIN:?APP_DOMAIN is required}`)
        - traefik.http.routers.reino_app.entrypoints=websecure
        - traefik.http.routers.reino_app.tls.certresolver=letsencryptresolver
        - traefik.http.services.reino_app.loadbalancer.server.port=3000
    logging: &json-logs
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

  postgres:
    image: postgres:18.6-alpine3.23
    stop_grace_period: 60s
    networks: [private]
    environment:
      POSTGRES_DB: credit_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password, schema_owner_password, app_runtime_password, backup_reader_password]
    configs:
      - source: postgres-init-users
        target: /docker-entrypoint-initdb.d/001-users.sh
        mode: 0555
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d credit_system"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    deploy:
      restart_policy: { condition: on-failure, delay: 5s, max_attempts: 3 }
      resources:
        limits: { cpus: "2", memory: 4G }
        reservations: { cpus: "0.5", memory: 1G }
    logging: *json-logs

  clamav:
    image: clamav/clamav:1.4.6_base-debian13-slim
    stop_grace_period: 60s
    networks: [private]
    volumes: [clamav_data:/var/lib/clamav]
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      restart_policy: { condition: on-failure, delay: 10s, max_attempts: 3 }
      resources:
        limits: { cpus: "2", memory: 5G }
        reservations: { cpus: "0.5", memory: 4G }
    logging: *json-logs

  migrate:
    image: *app_image
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    command: ["node", "scripts/db/migrate.mjs"]
    networks: [private]
    environment:
      DATABASE_OWNER_URL_FILE: /run/secrets/database_owner_url
    secrets: [database_owner_url]
    deploy:
      # ponytail: operator-invoked one-shot. Swarm has no run-once-before-app
      # ordering; Task 15 cutover runbook must `docker service scale
      # <stack>_migrate=1`, verify exit 0, then scale back before app routing.
      # Compose `depends_on` is not a Swarm ordering primitive — do not add it.
      replicas: 0
      restart_policy: { condition: none }
      resources:
        limits: { cpus: "0.5", memory: 512M }
        reservations: { cpus: "0.1", memory: 128M }
    logging: *json-logs

networks:
  RainhaNet:
    external: true
    name: RainhaNet
  private:
    driver: overlay
    internal: true
    driver_opts:
      encrypted: "true"

volumes:
  postgres_data:
  documents:
  clamav_data:

configs:
  postgres-init-users:
    file: ./docker/postgres/init/001-users.sh

secrets:
  database_url: { external: true }
  database_owner_url: { external: true }
  better_auth_secret: { external: true }
  smtp_pass: { external: true }
  deps_api_password: { external: true }
  openai_api_key: { external: true }
  postgres_password: { external: true }
  schema_owner_password: { external: true }
  app_runtime_password: { external: true }
  backup_reader_password: { external: true }
