services:
  reino_app:
    # Digest-only: owner + sha256 digest are both required, so a mutable tag or
    # `latest` can never satisfy stack config. Digest comes from the GHCR build.
    image: &app_image ghcr.io/${REINO_IMAGE_OWNER:?REINO_IMAGE_OWNER is required}/reino-credito@sha256:${REINO_IMAGE_DIGEST:?REINO_IMAGE_DIGEST must be the 64 hex characters sha256 digest of the release image}
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    stop_grace_period: 30s
    networks: [traefik, private]
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      TZ: America/Sao_Paulo
      BETTER_AUTH_URL: https://${APP_DOMAIN:?APP_DOMAIN is required}
      TRAEFIK_PROXY_CIDR: ${TRAEFIK_PROXY_CIDR:?TRAEFIK_PROXY_CIDR is required}
      DOCUMENT_ROOT: /var/lib/reino/documents
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:?SMTP_USER is required}
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM is required}
      DEPS_API_BASE_URL: ${DEPS_API_BASE_URL:-https://api-portal.deps.com.br}
      DEPS_API_EMAIL: ${DEPS_API_EMAIL:?DEPS_API_EMAIL is required}
      DEPS_API_CENTRO_CUSTOS: ${DEPS_API_CENTRO_CUSTOS:-}
      DEPS_PRODUTO_PF: ${DEPS_PRODUTO_PF:-Smart PF 002}
      DEPS_PRODUTO_PJ: ${DEPS_PRODUTO_PJ:-Smart PJ 010}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      WHATSAPP_DRIVER: ${WHATSAPP_DRIVER:-}
      # Affiliate withdrawals stay off until the accountant validates them (docs/operations/affiliates.md).
      AFFILIATE_WITHDRAWALS_ENABLED: ${AFFILIATE_WITHDRAWALS_ENABLED:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_GRAPH_VERSION: ${WHATSAPP_GRAPH_VERSION:-v21.0}
      DATABASE_URL_FILE: /run/secrets/database_url
      # Role app_webhook: Asaas webhook, WhatsApp webhook (apply_asaas_payment, apply_whatsapp_status, record_notification_opt_out).
      DATABASE_WEBHOOK_URL_FILE: /run/secrets/database_webhook_url
      # Role app_dispatch: only the notifications dispatch route (EXECUTE on claim_notifications, complete_notification).
      DISPATCH_DATABASE_URL_FILE: /run/secrets/dispatch_database_url
      BETTER_AUTH_SECRET_FILE: /run/secrets/better_auth_secret
      SMTP_PASS_FILE: /run/secrets/smtp_pass
      DEPS_API_PASSWORDL_FILE: /run/secrets/deps_api_password
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
      LGPD_PURGE_ENABLED: ${LGPD_PURGE_ENABLED:-0}
      SUPERADMIN_PASSWORD_FILE: /run/secrets/superadmin_password
      WHATSAPP_ACCESS_TOKEN_FILE: /run/secrets/whatsapp_access_token
      WHATSAPP_APP_SECRET_FILE: /run/secrets/whatsapp_app_secret
      WHATSAPP_VERIFY_TOKEN_FILE: /run/secrets/whatsapp_verify_token
      NOTIFICATIONS_DISPATCH_SECRET_FILE: /run/secrets/notifications_dispatch_secret
      # Web Push (VAPID). Public key and contact empty = push off (the private key secret then holds a placeholder).
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT:-}
      WEB_PUSH_VAPID_PRIVATE_KEY_FILE: /run/secrets/web_push_vapid_private_key
      # PII key ring (id:base64). Docker secret on purpose: never a plain env var.
      PII_ENCRYPTION_KEY_FILE: /run/secrets/pii_encryption_key
      # Card installment fees "months:percent:fixed_cents,..." (default = Asaas contract of 2026-11-09, 2.99% + R$ 0.49 up to 12x; set it empty to disable card) and the minimum installment.
      CARD_FEE_TABLE: ${CARD_FEE_TABLE:-1:2.99:49,6:2.99:49,12:2.99:49}
      CARD_MIN_INSTALLMENT_CENTS: ${CARD_MIN_INSTALLMENT_CENTS:-500}
      # Pix fee passed on to the payer, in cents (199 = R$ 1,99; 0 = no fee). Required: deploy fails when empty or unset.
      PIX_FEE_CENTS: ${PIX_FEE_CENTS:?PIX_FEE_CENTS required (199 = R$ 1,99; 0 = no fee)}
      # Asaas: empty driver = Asaas off (the app still starts; Pix, card and webhook answer an error). Plain values from .env.production.
      ASAAS_DRIVER: ${ASAAS_DRIVER:-}
      ASAAS_API_BASE_URL: ${ASAAS_API_BASE_URL:-https://api.asaas.com}
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:-}
    secrets: [database_url, database_webhook_url, dispatch_database_url, better_auth_secret, smtp_pass, deps_api_password, openai_api_key, superadmin_password, whatsapp_access_token, whatsapp_app_secret, whatsapp_verify_token, notifications_dispatch_secret, web_push_vapid_private_key, pii_encryption_key]
    volumes:
      - documents:/var/lib/reino/documents
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 160s
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      update_config:
        order: stop-first
        failure_action: rollback
        delay: 10s
      rollback_config:
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      resources:
        limits: { cpus: "1", memory: 1024M }
        reservations: { cpus: "0.25", memory: 512M }
      labels:
        - traefik.enable=true
        - traefik.docker.network=${TRAEFIK_NETWORK:-RainhaNet}
        # /api/internal só pela rede privada do Swarm (o cron chama reino_app:3000): o roteador público não o serve.
        - traefik.http.routers.creditsystem_app.rule=Host(`${APP_DOMAIN:?APP_DOMAIN is required}`) && !PathPrefix(`/api/internal`)
        - traefik.http.routers.creditsystem_app.entrypoints=websecure
        - traefik.http.routers.creditsystem_app.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencryptresolver}
        - traefik.http.services.creditsystem_app.loadbalancer.server.port=3000
    logging: &json-logs
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

  # Calls the dispatch route of reino_app every 60 s (outbox worker). Own entrypoint:
  # it must NOT wait for the schema like the app entrypoint does.
  notifications_cron:
    image: *app_image
    entrypoint: ["node", "scripts/notifications-cron.mjs"]
    user: "1001:1001"
    read_only: true
    stop_grace_period: 10s
    networks: [private]
    environment:
      NODE_ENV: production
      TZ: America/Sao_Paulo
      NOTIFICATIONS_DISPATCH_URL: http://reino_app:3000/api/internal/notifications/dispatch
      ORDERS_TICK_URL: http://reino_app:3000/api/internal/orders/tick
      NOTIFICATIONS_DISPATCH_SECRET_FILE: /run/secrets/notifications_dispatch_secret
      OPS_ALERT_TO: ${OPS_ALERT_TO:-}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:?SMTP_USER is required}
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM is required}
      SMTP_PASS_FILE: /run/secrets/smtp_pass
      BACKUP_STATE_FILE: /var/lib/backup/last-success
    secrets: [notifications_dispatch_secret, smtp_pass]
    volumes:
      - backup_state:/var/lib/backup:ro
    deploy:
      # O provider swarm do Traefik expõe todo serviço por padrão: sem isto ele tenta rotear o serviço interno.
      labels:
        - traefik.enable=false
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      resources:
        limits: { cpus: "0.1", memory: 64M }
    logging: *json-logs

  postgres:
    image: postgres:18.6-alpine3.23
    stop_grace_period: 60s
    # Alias único: o nome 'postgres' colide com outras stacks na rede do Traefik.
    networks:
      private:
        aliases: [reino-db]
    environment:
      POSTGRES_DB: credit_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password, schema_owner_password, app_runtime_password, backup_reader_password, app_webhook_password, app_dispatch_password]
    configs:
      - source: postgres-init-users
        target: /docker-entrypoint-initdb.d/001-users.sh
        mode: 0555
    # PG18 layout: PGDATA=/var/lib/postgresql/18/docker, so mount at /var/lib/postgresql.
    # A stack deployed earlier with the old /var/lib/postgresql/data mount keeps its data
    # in an anonymous volume: run pg_dump BEFORE redeploy.
    volumes: [postgres_data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d credit_system"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    deploy:
      # O provider swarm do Traefik expõe todo serviço por padrão: sem isto ele tenta rotear o serviço interno.
      labels:
        - traefik.enable=false
      restart_policy: { condition: on-failure, delay: 5s, max_attempts: 3 }
      resources:
        limits: { cpus: "2", memory: 4G }
        reservations: { cpus: "0.5", memory: 1G }
    logging: *json-logs

  clamav:
    image: clamav/clamav:1.4.6_base-debian13-slim
    stop_grace_period: 60s
    networks: [private]
    volumes: [clamav_data:/var/lib/clamav]
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      # O provider swarm do Traefik expõe todo serviço por padrão: sem isto ele tenta rotear o serviço interno.
      labels:
        - traefik.enable=false
      restart_policy: { condition: on-failure, delay: 10s, max_attempts: 3 }
      resources:
        limits: { cpus: "2", memory: 5G }
        reservations: { cpus: "0.5", memory: 4G }
    logging: *json-logs

  # One-shot schema migration (forward-only, checksum-tracked). The only
  # service that holds the owner/superuser DSN. reino_app waits for it with
  # `migrate.mjs --check` (docker/app-entrypoint.sh).
  migrate:
    image: *app_image
    command: ["node", "scripts/db/migrate.mjs"]
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    networks: [private]
    environment:
      NODE_ENV: production
      DATABASE_OWNER_URL_FILE: /run/secrets/database_owner_url
    secrets: [database_owner_url]
    deploy:
      # O provider swarm do Traefik expõe todo serviço por padrão: sem isto ele tenta rotear o serviço interno.
      labels:
        - traefik.enable=false
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 30
    logging: *json-logs

  backup:
    # Own multi-stage image (PG18 client + Restic 0.18.1 + curl SMTP). Same
    # digest-pin rule as reino_app: owner + 64-hex sha256 both required.
    image: ghcr.io/${REINO_IMAGE_OWNER:?REINO_IMAGE_OWNER is required}/reino-backup@sha256:${REINO_BACKUP_DIGEST:?REINO_BACKUP_DIGEST must be the 64 hex characters sha256 digest of the backup image}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
      - /run/lock:rw,noexec,nosuid,nodev,size=1m
    stop_grace_period: 30s
    # Internal encrypted overlay only. No Traefik, no published port, no Docker
    # socket. Reaches postgres for pg_dump; the Restic repo is an S3 bucket.
    networks: [private]
    environment:
      TZ: America/Sao_Paulo
      PGHOST: reino-db
      PGPORT: "5432"
      PGUSER: backup_reader
      PGDATABASE: credit_system
      PGPASSWORD_FILE: /run/secrets/backup_reader_password
      DOCUMENT_ROOT: /var/lib/reino/documents
      # Off-site S3 repository. Encryption at rest is on (restic_password).
      RESTIC_REPOSITORY: s3:${RESTIC_S3_ENDPOINT:?RESTIC_S3_ENDPOINT is required}/${RESTIC_S3_BUCKET:?RESTIC_S3_BUCKET is required}
      AWS_ACCESS_KEY_ID_FILE: /run/secrets/restic_s3_access_key
      AWS_SECRET_ACCESS_KEY_FILE: /run/secrets/restic_s3_secret_key
      RESTIC_PASSWORD_FILE: /run/secrets/restic_password
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:?SMTP_USER is required}
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM is required}
      SMTP_PASS_FILE: /run/secrets/smtp_pass
      BACKUP_ALERT_TO: ${BACKUP_ALERT_TO:?BACKUP_ALERT_TO is required}
      OPS_ALERT_TO: ${OPS_ALERT_TO:-}
      # Core tables the monthly restore drill must find in the restored dump.
      RESTORE_REQUIRED_TABLES: >-
        schema_migrations user session account profiles
        crm_clients crm_client_documents batches consultations
        scr_authorizations bureau_payloads bureau_results ai_reports
        company_reports timeline_events
        crm_notes settings audit_logs
    secrets: [backup_reader_password, restic_password, restic_s3_access_key, restic_s3_secret_key, smtp_pass]
    volumes:
      - documents:/var/lib/reino/documents:ro
      - backup_state:/var/lib/backup
      - backup_work:/work
    healthcheck:
      test: ["CMD-SHELL", "pgrep crond >/dev/null"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      # O provider swarm do Traefik expõe todo serviço por padrão: sem isto ele tenta rotear o serviço interno.
      labels:
        - traefik.enable=false
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy: { condition: on-failure, delay: 15s, max_attempts: 3 }
      resources:
        limits: { cpus: "1", memory: 1024M }
        reservations: { cpus: "0.1", memory: 128M }
    logging: *json-logs

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-RainhaNet}
  private:
    driver: overlay
    internal: true
    driver_opts:
      encrypted: "true"

volumes:
  postgres_data:
  documents:
  clamav_data:
  backup_state:
  backup_work:

configs:
  postgres-init-users:
    file: ./docker/postgres/init/001-users.sh

secrets:
  database_url: { external: true }
  database_webhook_url: { external: true }
  dispatch_database_url: { external: true }
  database_owner_url: { external: true }
  better_auth_secret: { external: true }
  smtp_pass: { external: true }
  deps_api_password: { external: true }
  openai_api_key: { external: true }
  superadmin_password: { external: true }
  whatsapp_access_token: { external: true }
  whatsapp_app_secret: { external: true }
  whatsapp_verify_token: { external: true }
  notifications_dispatch_secret: { external: true }
  web_push_vapid_private_key: { external: true }
  pii_encryption_key: { external: true }
  postgres_password: { external: true }
  schema_owner_password: { external: true }
  app_runtime_password: { external: true }
  backup_reader_password: { external: true }
  app_webhook_password: { external: true }
  app_dispatch_password: { external: true }
  restic_password: { external: true }
  restic_s3_access_key: { external: true }
  restic_s3_secret_key: { external: true }
